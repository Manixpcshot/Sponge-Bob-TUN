name: Build & Release Windows Editions (Electron + Rust Tauri + Portables)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & attach (e.g. v1.1.0)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Download Xray-core Windows x64 binary (SHA-256 verified)
        run: node scripts/download-xray.mjs --platform win32 --arch x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version across package.json, Cargo.toml & tauri.conf.json
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag || '' }}"
          if (-not $tag -and "${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag) {
            $ver = $tag.TrimStart("v")
          } else {
            $pkg = Get-Content package.json | ConvertFrom-Json
            $ver = $pkg.version
            $tag = "v$ver"
          }
          Write-Host "Building release $tag (version $ver)"
          npm version $ver --no-git-tag-version --allow-same-version

          $tauriConf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriConf.version = $ver
          $tauriConf | ConvertTo-Json -Depth 12 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          $cargoToml = $cargoToml -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`""
          Set-Content src-tauri/Cargo.toml $cargoToml -Encoding utf8

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Typecheck & Run Frontend + Rust Tests
        run: |
          npm run typecheck
          npm test
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Electron NSIS Installer & Clean Electron Portables (EXE + ZIP)
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          npx electron-builder --win nsis --x64 --publish never

          # Prepare clean unpacked folder for Electron Portables (no app-update.yml, explicit PORTABLE_MODE.txt)
          $unpacked = "release/win-unpacked"
          $appUpdateYml = Join-Path $unpacked "resources/app-update.yml"
          if (Test-Path $appUpdateYml) {
            Remove-Item $appUpdateYml -Force
          }
          @"
          Sponge bob tun Portable Mode
          Vault & runtime data are saved next to the executable in SpongeBobTUN-Data/.
          "@ | Set-Content (Join-Path $unpacked "PORTABLE_MODE.txt") -Encoding utf8

          npx electron-builder --win portable --x64 --prepackaged $unpacked --publish never

          $zipPath = "release/Sponge-bob-tun-Electron-Portable-$ver-win-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$unpacked\*" -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Build Rust + Tauri v2 Setup Installer, Portable ZIP & Single-File Portable EXE
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION

          # 1) Build standard Tauri binary + NSIS installer
          npx tauri build --bundles nsis --ci
          $nsisOut = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsisOut) { throw "Tauri NSIS setup executable not generated" }
          Copy-Item $nsisOut.FullName "release/Sponge-bob-tun-Tauri-Setup-$ver.exe" -Force

          # 2) Package Tauri Portable ZIP from clean non-embedded binary + resources/bin/win32
          $tauriBin = "src-tauri/target/release/sponge-bob-tun.exe"
          if (-not (Test-Path $tauriBin)) { throw "Tauri release executable missing" }
          $staging = "release/tauri-portable-staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path "$staging/bin/win32" -Force | Out-Null
          Copy-Item $tauriBin "$staging/Sponge bob tun.exe" -Force
          Copy-Item "resources/bin/win32/*" "$staging/bin/win32/" -Force
          @"
          Sponge bob tun (Rust + Tauri v2) Portable Mode
          Encrypted vault, proxy backup, and WebView2 profile stay in SpongeBobTUN-Data/.
          "@ | Set-Content "$staging/PORTABLE_MODE.txt" -Encoding utf8

          $tauriZip = "release/Sponge-bob-tun-Tauri-Portable-$ver-win-x64.zip"
          if (Test-Path $tauriZip) { Remove-Item $tauriZip -Force }
          Compress-Archive -Path "$staging\*" -DestinationPath $tauriZip -CompressionLevel Optimal
          Remove-Item $staging -Recurse -Force

          # 3) Build single-file standalone Tauri Portable EXE with embedded compressed Xray-core
          npx tauri build --no-bundle --features embed-xray --ci
          Copy-Item "src-tauri/target/release/sponge-bob-tun.exe" "release/Sponge-bob-tun-Tauri-Portable-$ver.exe" -Force

      - name: Verify All Release Binaries & Archives
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          $expected = @(
            "Sponge-bob-tun-Setup-$ver.exe",
            "Sponge-bob-tun-Setup-$ver.exe.blockmap",
            "latest.yml",
            "Sponge-bob-tun-Electron-Portable-$ver.exe",
            "Sponge-bob-tun-Electron-Portable-$ver-win-x64.zip",
            "Sponge-bob-tun-Tauri-Setup-$ver.exe",
            "Sponge-bob-tun-Tauri-Portable-$ver.exe",
            "Sponge-bob-tun-Tauri-Portable-$ver-win-x64.zip"
          )
          foreach ($name in $expected) {
            $full = Join-Path "release" $name
            if (-not (Test-Path $full)) { throw "Missing expected artifact: $name" }
            $item = Get-Item $full
            if ($item.Length -eq 0) { throw "Artifact is empty: $name" }
            if ($name.EndsWith(".exe")) {
              if ($item.Length -lt 1000000) { throw "Executable suspiciously small: $name ($($item.Length) bytes)" }
              $bytes = [System.IO.File]::ReadAllBytes($full)[0..1]
              if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid PE MZ header: $name" }
            }
            Write-Host ("VERIFIED: {0,-56} {1,10:N0} bytes" -f $name, $item.Length)
          }

      - name: Ensure GitHub Release exists and upload Windows binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $ver = $env:APP_VERSION
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Sponge bob tun $tag" --notes "Automated Windows x64 build for $tag (Electron Setup + Portables AND Rust/Tauri v2 Setup + Portables with bundled SHA-256 verified Xray-core)."
          }
          $files = @(
            "release/Sponge-bob-tun-Setup-$ver.exe",
            "release/Sponge-bob-tun-Setup-$ver.exe.blockmap",
            "release/latest.yml",
            "release/Sponge-bob-tun-Electron-Portable-$ver.exe",
            "release/Sponge-bob-tun-Electron-Portable-$ver-win-x64.zip",
            "release/Sponge-bob-tun-Tauri-Setup-$ver.exe",
            "release/Sponge-bob-tun-Tauri-Portable-$ver.exe",
            "release/Sponge-bob-tun-Tauri-Portable-$ver-win-x64.zip"
          )
          gh release upload $tag @files --clobber
