[package]
name = "sponge-bob-tun"
version = "1.1.0"
description = "Sponge bob tun (باب اسفنجی) — Rust + Tauri v2 Windows VLESS Xray local proxy desktop client"
authors = ["Manixpcshot"]
license = "MIT"
edition = "2021"

[features]
default = []
embed-xray = []

[lib]
name = "sponge_bob_tun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"
sha2 = "0.10"
hex = "0.4"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "deflate", "json"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"
flate2 = "1"
regex = "1"
once_cell = "1"
hex = "0.4"
h2 = "0.4"
http = "1"
bytes = "1"
rfd = "0.15"
semver = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Networking_WinInet",
  "Win32_Security_Cryptography"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
